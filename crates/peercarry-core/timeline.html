  const day = s => new Date(s.getFullYear(), s.getMonth(), s.getDate()).getTime();
  const diff = Math.round((day(now) - day(d)) / 86400000);
  if (diff === 0) return T.today;
  if (diff === 1) return T.yesterday;
  return d.toLocaleDateString(window.PeerCarryLocale.locale, { year: 'numeric', month: 'short', day: 'numeric', weekday: 'short' });
}

async function refresh() {
  const ticket = ++seq, query = q.value.trim();
  const url = '/v1/timeline?limit=200&max=1000' + (query ? '&q=' + encodeURIComponent(query) : '');
  try {
    const resp = await fetch(url);
    if (resp.status === 401) { show(zh ? '无法访问记录，请从本机托盘打开。' : 'Cannot access history. Open the app from your local tray.', 'err'); return false; }
    if (!resp.ok) throw new Error(resp.status);
    const data = await resp.json();
    if (ticket !== seq) return null;         // a newer query already rendered
    entries = data;
    sel = 0;
    render();
    return true;
  } catch (e) { show((zh ? '读取最近内容失败：' : 'Could not load recent content: ') + e, 'err'); return false; }
}

function render() {
  const target = $('remote-peer').value;
  $('history-device').disabled = !target;
  $('history-device').textContent = currentPeer() ? peerLabel(currentPeer()) : (zh ? '所选设备' : 'Selected device');
  $('history-all').setAttribute('aria-pressed', String(historyScope === 'all'));
  $('history-device').setAttribute('aria-pressed', String(historyScope === 'device'));
  const indexes = visibleIndexes();
  if (!indexes.includes(sel)) sel = indexes[0] ?? 0;
  count.textContent = T.count(indexes.length);
  if (!indexes.length) { list.innerHTML = `<div class="empty">${historyScope === 'device' ? (zh ? '该设备还没有记录。点击获取后，内容会出现在这里。' : 'No history from this device. Fetch its clipboard to add an entry.') : T.empty}</div>`; return; }
  let html = '', lastDay = '';
  for (const index of indexes) {
    const e = entries[index];
    const day = dayLabel(e.created_at);
    if (day !== lastDay) { html += `<div class="day">${day}</div>`; lastDay = day; }
    const kind = ['text', 'image', 'files'].includes(e.kind) ? e.kind : 'text';
    html += `<div class="item${index === sel ? ' sel' : ''}" data-i="${index}">`
      + `<span class="entry-icon ${kind}">${icon(kind)}</span>`
      + `<div class="entry-copy"><span class="preview">${escapeHtml(e.preview)}</span><span class="entry-meta"><span class="host">${escapeHtml(e.origin?.host || '')}</span><span>${hhmm(e.created_at)}</span><span>${human(e.size)}</span></span></div>`
      + `<div class="entry-actions"><button class="item-action" data-copy="${index}">${zh ? '复制' : 'Copy'}</button>`
      + `<button class="item-action send-action" data-send="${index}">${zh ? '发送' : 'Send'}</button>`
      + (e.kind === 'files' ? `<button class="item-action" data-download="${index}">${zh ? '下载' : 'Download'}</button>` : '')
      + `<button class="pin${e.pinned ? ' on' : ''}" data-pin="${index}" aria-label="${zh ? (e.pinned ? '取消收藏' : '收藏') : (e.pinned ? 'Unpin' : 'Pin')}" aria-pressed="${!!e.pinned}">${e.pinned ? '★' : '☆'}</button></div></div>`;
  }
  list.innerHTML = html;
}

function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
}

async function apply(i) {
  const e = entries[i];
  if (!e || copyBusy) return;
  copyBusy = true;
  try {
    const resp = await fetch('/v1/actions/apply', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ id: e.id }),
    });
    if (!resp.ok) throw new Error('copy failed');
    const result = await resp.json();
    if (!result.ok) throw new Error('copy failed');
    show(zh ? '已复制到剪贴板' : 'Copied to clipboard', 'ok');
  } catch (_) { show(zh ? '复制失败，请重试。' : 'Could not copy. Try again.', 'err'); }
  finally { copyBusy = false; window.PeerCarryLocale?.retry?.(); }
}

async function togglePin(i) {
  const e = entries[i];
  if (!e) return;
  try {
    const resp = await fetch('/v1/actions/pin', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ id: e.id, pinned: !e.pinned }),
    });
    if (!resp.ok) throw new Error(resp.status);
    show(e.pinned ? T.unpinned : T.pinned, 'ok');
    refresh();
  } catch (err) { show((zh ? '更新收藏失败：' : 'Could not update favorite: ') + err, 'err'); }
}

list.addEventListener('click', ev => {
  const sendBtn = ev.target.closest('[data-send]');
  if (sendBtn) { sendEntry(entries[+sendBtn.dataset.send]); return; }
  const copyBtn = ev.target.closest('[data-copy]');
  if (copyBtn) { if (copyBusy) return; copyBtn.disabled = true; apply(+copyBtn.dataset.copy).finally(() => { copyBtn.disabled = false; }); return; }
  const downloadBtn = ev.target.closest('[data-download]');
  if (downloadBtn) { window.PeerCarryTransfers?.download(entries[+downloadBtn.dataset.download]); return; }
  const pinBtn = ev.target.closest('[data-pin]');
  if (pinBtn) { togglePin(+pinBtn.dataset.pin); return; }
  const row = ev.target.closest('.item');
  if (row) { sel = +row.dataset.i; render(); }
});

function moveSelection(delta) {
  const indexes = visibleIndexes();
  if (!indexes.length) return;
  sel = indexes[Math.min(indexes.length - 1, Math.max(0, indexes.indexOf(sel) + delta))];
  render();
  list.querySelector('.sel')?.scrollIntoView({ block: 'nearest' });
}

document.addEventListener('keydown', ev => {
  if (!$('timeline').hidden && !ev.target.closest('button, input, select, textarea, [contenteditable="true"]') && !ev.isComposing) {
    if (ev.key === 'ArrowDown') { ev.preventDefault(); moveSelection(1); }
    else if (ev.key === 'ArrowUp') { ev.preventDefault(); moveSelection(-1); }
    else if (ev.key === 'Enter' && !ev.ctrlKey && !ev.metaKey) { ev.preventDefault(); apply(sel); }
    else if ((ev.ctrlKey || ev.metaKey) && ev.key.toLowerCase() === 'p') { ev.preventDefault(); togglePin(sel); }
    else if (ev.key === 'Escape') { q.value = ''; refresh(); q.focus(); }
  }
});

let debounce;
q.addEventListener('input', () => { clearTimeout(debounce); debounce = setTimeout(refresh, 220); });
q.addEventListener('keydown', ev => {
  if (ev.isComposing) return;
  if (ev.key === 'Enter') { ev.preventDefault(); clearTimeout(debounce); refresh(); }
  if (ev.key === 'Escape') { q.value = ''; clearTimeout(debounce); refresh(); }
});

let cfg = null, configOriginal = null, configRevision = '', configSecrets = {};
let configLoadSequence = 0, configReady = false, configBusy = false, appsDirty = false;
let configSaving = false, settingsPendingTab = null;
let configInstance = '', configDesktopUrl = null, configRecovery = null;
const OPTIONAL_SETTINGS = new Set(['node.name', 'network.bind', 'storage.download_dir', 'storage.data_dir']);
$('cfg-reload').textContent = zh ? '重新加载' : 'Reload';
$('cfg-leave-help').textContent = zh ? '有尚未保存的设置。继续编辑，或明确放弃更改后离开。' : 'You have unsaved settings. Continue editing, or discard the changes before leaving.';

function clearSettingsLeavePrompt() {

function hasSettingsDraft() {

        $('cfgform').querySelector(`[data-path="${path}"]`)?.value) return true;

function setConfigBusy(busy) {
  configBusy = busy;
  $('cfg-save').disabled = $('cfg-save-restart').disabled = busy || !configReady;
  $('app-add').disabled = busy || !configReady;
  $('cfg-reload').disabled = busy;
  $('cfgform').inert = $('apps-rows').inert = busy || !configReady;
  if (!busy) window.PeerCarryLocale?.retry?.();
}

function acceptSettingsEnvelope(data) {
  if (!data || data.schema !== 1 || typeof data.revision !== 'string' || !data.revision ||
      !data.values || typeof data.values !== 'object' || !Array.isArray(data.values.apps) ||
      !data.secrets || typeof data.secrets['network.auth_token'] !== 'boolean' ||
      typeof data.secrets.ai_token !== 'boolean') throw new Error('invalid envelope');
  const values = {};
  for (const field of FIELDS) {
    if (!field.path || field.type === 'password') continue;
    const value = data.values[field.path];
    if ((field.type === 'bool' && typeof value !== 'boolean') ||
        (field.type === 'language' && !['system', 'zh', 'en'].includes(value)) ||
        (field.type === 'number' && (!Number.isSafeInteger(value) || value < 0)) ||
        (field.type === 'text' && typeof value !== 'string' && !(OPTIONAL_SETTINGS.has(field.path) && value === null))) {
      throw new Error('invalid field');
    }
    values[field.path] = value;
  }
  const apps = data.values.apps.map(app => {
    if (!app || typeof app.name !== 'string' || typeof app.path !== 'string' ||
        !Array.isArray(app.args) || !app.args.every(arg => typeof arg === 'string')) throw new Error('invalid app');
    return { name: app.name, path: app.path, args: [...app.args] };
  });
  cfg = { values, apps };
  configOriginal = { values: { ...values }, apps: apps.map(app => ({ ...app, args: [...app.args] })) };
  configRevision = data.revision;
  configSecrets = { 'network.auth_token': data.secrets['network.auth_token'], ai_token: data.secrets.ai_token };
  configInstance = typeof data.instance_id === 'string' ? data.instance_id : '';
  configDesktopUrl = localReconnectUrl(data.desktop_url);
  appsDirty = false;
}

function localReconnectUrl(value) {
  if (typeof value !== 'string') return null;
  try {
    const url = new URL(value);
    const host = url.hostname;
    const octets = host.split('.');
    const loopback = host === 'localhost' || host === '[::1]' ||
      (octets.length === 4 && octets[0] === '127' && octets.every(n => /^\d+$/.test(n) && +n <= 255));
    return loopback && url.protocol === 'http:' && !url.username && !url.password &&
      url.pathname === '/' && !url.search && !url.hash ? url : null;
  } catch (_) { return null; }
}
function stopRestartRecovery() {
  if (!configRecovery) return;
  clearTimeout(configRecovery.timer);
  configRecovery.controller?.abort();
  configRecovery = null;
}
window.addEventListener?.('pagehide', stopRestartRecovery);
function showReconnectLink(url) {
  const link = $('cfg-reconnect');
  link.hidden = !url;
  if (!url) { link.removeAttribute('href'); return; }
  link.href = url.href;
  link.rel = 'noopener noreferrer';
  link.textContent = (zh ? '重新打开本机页面：' : 'Open the local page: ') + url.href;
}
function beginRestartRecovery(ticket, lost = false) {
  stopRestartRecovery();
  configReady = false;
  $('cfg-reload').hidden = false;
  showReconnectLink(configDesktopUrl);
  status(lost
    ? (zh ? '已保存，连接中断，重启结果尚未确认。正在检查连接…' : 'Saved; the connection was lost and restart is unconfirmed. Checking the connection…')
    : (zh ? '已请求重启，连接尚未确认。正在检查连接…' : 'Restart requested; reconnection is not yet confirmed. Checking the connection…'), '');
  const pageUrl = localReconnectUrl(window.location?.origin + '/');
  // Loopback aliases can name the same listener. Always probe the current
  // origin, and only while the planned port remains the same.
  if (!configInstance || !configDesktopUrl || !pageUrl || configDesktopUrl.port !== pageUrl.port) {
    status(zh ? '已保存，重启结果尚未确认。请稍后打开本机页面，或从托盘重新进入。' : 'Saved; restart is unconfirmed. Open the local page shortly, or reopen it from the tray.', '');
    return;
  }
  const recovery = { ticket, instance: configInstance, attempts: 0, deadline: Date.now() + 15000 };
  configRecovery = recovery;
  recovery.timer = setTimeout(() => checkRestartRecovery(recovery), 500);
}
async function checkRestartRecovery(recovery) {
  const current = () => configRecovery === recovery && recovery.ticket === configLoadSequence && activeTab === 'settings';
  if (!current()) return;
  const controller = new AbortController();
  recovery.controller = controller;
  const timeout = setTimeout(() => controller.abort(), 1200);
  ++recovery.attempts;
  try {
    const response = await fetch('/v1/desktop/settings', { cache: 'no-store', redirect: 'error', signal: controller.signal });
    if (!current()) return;
    if (response.ok) {
      const data = await response.json();
      if (!current()) return;
      if (typeof data.instance_id === 'string' && data.instance_id && data.instance_id !== recovery.instance &&
          typeof data.restart_recommended === 'boolean') {
        acceptSettingsEnvelope(data);
        stopRestartRecovery();
        configReady = true;
        $('cfg-reload').hidden = true;
        showReconnectLink(null);
        renderSettings();
        setConfigBusy(false);
        status(data.restart_recommended
          ? (zh ? '服务已恢复；仍有设置修改需重启后生效。' : 'Service reconnected. Some settings still require a restart.')
          : (zh ? '服务已重新连接，设置已重新加载。' : 'Service reconnected; settings reloaded.'), 'ok');
        return;
      }
    }
  } catch (_) {
    // A refused connection is expected while the replacement is starting.
  } finally {
    clearTimeout(timeout);
    if (recovery.controller === controller) recovery.controller = null;
  }
  if (!current()) return;
  if (recovery.attempts >= 20 || Date.now() >= recovery.deadline) {
    stopRestartRecovery();
    status(zh ? '重启结果尚未确认。请重新加载，或从本机入口检查服务。' : 'Restart is unconfirmed. Reload, or check the service through the local page.', 'err');
    return;
  }
  recovery.timer = setTimeout(() => checkRestartRecovery(recovery), 500);
}

async function loadConfig() {
  if (configSaving) return false;
  stopRestartRecovery();
  const ticket = ++configLoadSequence;
  clearSettingsLeavePrompt();
  configReady = false;
  setConfigBusy(true);
  $('cfg-reload').hidden = true;
  try {
    const response = await fetch('/v1/desktop/settings', { cache: 'no-store' });
    if (!response.ok) throw new Error('unavailable');
    const data = await response.json();
    if (ticket !== configLoadSequence || activeTab !== 'settings') return false;
    acceptSettingsEnvelope(data);
    showReconnectLink(null);
    configReady = true;
    renderSettings();
    setConfigBusy(false);
    status('', '');
    return true;
  } catch (_) {
    if (ticket === configLoadSequence && activeTab === 'settings') {
      configReady = false;
      setConfigBusy(false);
      $('cfg-reload').hidden = false;
      status(zh ? '无法读取本机设置，请检查服务后重新加载。' : 'Could not load local settings. Check the service and reload.', 'err');
    }

function renderSettings() {
  const form = $('cfgform');
  let html = '';
  for (const f of FIELDS) {
    if (f.sec) { html += `<h2>${f.sec}</h2>`; continue; }
    const value = f.type === 'password' ? '' : cfg.values[f.path];
    const note = f.live
      ? `<span class="note live">${T.liveNote}</span>`
      : f.restart ? `<span class="note restart">${T.restartNote}</span>` : '';
    let input;
    if (f.type === 'password') {
      const configured = configSecrets[f.path] ? (zh ? '已配置' : 'Configured') : (zh ? '未配置' : 'Not configured');
      input = `<span class="secret-state">${configured}</span>
        <select data-secret-op="${f.path}" aria-label="${escapeHtml(f.label)}">
          <option value="keep">${zh ? '保持' : 'Keep'}</option>
          <option value="replace">${zh ? '替换' : 'Replace'}</option>
          <option value="clear">${zh ? '清除' : 'Clear'}</option>
        </select>
        <input type="password" data-path="${f.path}" aria-label="${escapeHtml(f.label)}" autocomplete="new-password" disabled
          placeholder="${zh ? '输入新令牌' : 'Enter a new token'}">`;
    } else if (f.type === 'language') {
      input = `<select id="cfg-${f.path}" data-path="${f.path}" aria-label="${escapeHtml(f.label)}">`
        + [['system', zh ? '跟随系统' : 'Follow system'], ['zh', '简体中文'], ['en', 'English']]
          .map(([code, label]) => `<option value="${code}" ${value === code ? 'selected' : ''}>${label}</option>`).join('')
        + '</select>';
    } else if (f.type === 'bool') {
      input = `<input id="cfg-${f.path}" type="checkbox" data-path="${f.path}" ${value ? 'checked' : ''}>`;
    } else {
      input = `<input id="cfg-${f.path}" type="${f.type === 'number' ? 'number' : 'text'}" data-path="${f.path}" ${f.min != null ? `min="${f.min}" max="${f.max}" step="1"` : ''}
        value="${escapeHtml(value == null ? '' : String(value))}" placeholder="${escapeHtml(f.ph || '')}">`;
    }
    html += `<div class="row"><label class="main" ${f.type === 'password' ? '' : `for="cfg-${f.path}"`}>${f.label}</label><div class="ctl">${input}</div>${note}</div>`;
    if (f.help) html += `<p class="transfer-note">${f.help}</p>`;
  }
  form.innerHTML = html;
  renderApps();
  $('app-add').textContent = T.appAdd;
  $('cfg-save').textContent = T.save;
  $('cfg-save-restart').textContent = T.saveRestart;
  $('cfg-reload').textContent = zh ? '重新加载' : 'Reload';
  $('apps-title').textContent = T.apps;
}

function renderApps() {
  const rows = (cfg.apps || []).map((app, i) =>
    `<div class="row" data-app="${i}">
       <input class="cname" data-app-field="name" value="${escapeHtml(app.name)}" placeholder="${T.appNamePh}" title="${T.appName}">
       <input class="cpath" data-app-field="path" value="${escapeHtml(app.path)}" placeholder="${T.appPath}" title="${T.appPath}">
       <input class="cargs" data-app-field="args" value="${escapeHtml((app.args || []).join(', '))}" placeholder="${T.appArgs}" title="${T.appArgs}">
       <button class="del" data-app-del="${i}">${T.del}</button>
     </div>`).join('');
  $('apps-rows').innerHTML = rows;
}

$('app-add').onclick = () => {
  if (!configReady || configBusy) return;
  cfg.apps = readApps();
  cfg.apps.push({ name: '', path: '', args: [] });
  appsDirty = true;
  renderApps();
};
$('apps-rows').addEventListener('click', ev => {
  const del = ev.target.closest('[data-app-del]');
  if (del && configReady && !configBusy) {
    cfg.apps = readApps();
    cfg.apps.splice(+del.dataset.appDel, 1);
    appsDirty = true;
    renderApps();
  }
});
$('apps-rows').addEventListener('input', ev => {
  if (ev.target.dataset.appField) appsDirty = true;
});
$('cfgform').addEventListener('change', ev => {
  const path = ev.target.dataset.secretOp;
  if (!path) return;
  const input = $('cfgform').querySelector(`[data-path="${path}"]`);
  if (input) input.disabled = ev.target.value !== 'replace';
});

function readApps() {
  return [...document.querySelectorAll('#apps-rows [data-app]')].map((row, index) => {
    const argsText = row.querySelector('[data-app-field=args]').value;
    const prior = cfg.apps[index]?.args || [];
    return {
      name: row.querySelector('[data-app-field=name]').value.trim(),
      path: row.querySelector('[data-app-field=path]').value.trim(),
      args: argsText === prior.join(', ') ? [...prior] : argsText.split(',').map(s => s.trim()).filter(Boolean),
    };
  });
}

function collectConfig() {
  const changes = {}, secretChanges = {};
  document.querySelectorAll('#cfgform [data-path]').forEach(input => {
    const path = input.dataset.path;
    const field = FIELDS.find(f => f.path === path);
    if (!field || field.type === 'password') return;
    let value;
    if (input.type === 'checkbox') value = input.checked;
    else if (input.type === 'number') {
      value = Number(input.value);
      if (input.value.trim() === '' || !Number.isSafeInteger(value) || value < 0) throw new Error('invalid field');
    } else value = input.value === '' && OPTIONAL_SETTINGS.has(path) ? null : input.value;
    if (field.type === 'language' && !['system', 'zh', 'en'].includes(value)) throw new Error('invalid language');
    if (value !== configOriginal.values[path]) changes[path] = value;
  });
  if (appsDirty) {
    const apps = readApps();
    if (JSON.stringify(apps) !== JSON.stringify(configOriginal.apps)) changes.apps = apps;
  }
  for (const path of ['network.auth_token', 'ai_token']) {
    const op = $('cfgform').querySelector(`[data-secret-op="${path}"]`)?.value || 'keep';
    if (op === 'clear') secretChanges[path] = { op: 'clear' };
    else if (op === 'replace') {
      const value = $('cfgform').querySelector(`[data-path="${path}"]`)?.value || '';
      if (!/^[\x21-\x7e]{32,256}$/.test(value)) throw new Error('invalid token');
      secretChanges[path] = { op: 'replace', value };
    } else if (op !== 'keep') throw new Error('invalid operation');
  }
  return { revision: configRevision, changes, secret_changes: secretChanges };
}

function status(msg, cls) {
  const el = $('cfg-status');
  el.textContent = msg;
  el.className = cls || '';
}

async function saveConfig(andRestart) {
  if (!configReady || !cfg || configBusy) return;
  let payload;
  try {
    payload = collectConfig();
  } catch (_) {
    status(zh ? '请检查数值；替换令牌须为 32 至 256 个可见非空白 ASCII 字符。' : 'Check numeric values. A replacement token must contain 32–256 visible non-whitespace ASCII characters.', 'err');
    return;
  }
  const ticket = configLoadSequence;
  let languageSaved = false;
  stopRestartRecovery();
  showReconnectLink(null);
  clearSettingsLeavePrompt();
  configSaving = true;
  setConfigBusy(true);
  status(zh ? '正在保存…' : 'Saving…', '');
  try {
    const response = await fetch('/v1/desktop/settings', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload),
    });
    if (ticket !== configLoadSequence || activeTab !== 'settings') return;
    if (!response.ok) {
      if ([401, 403, 404, 405, 409].includes(response.status) || response.status >= 500) {
        configReady = false;
        $('cfg-reload').hidden = false;
      }
      status(response.status === 409
        ? (zh ? '配置已更改，当前表单已保留。请明确重新加载后再保存。' : 'Settings changed elsewhere. Your form is kept; reload before saving.')
        : (zh ? '保存失败，当前表单已保留。请检查输入或重新加载。' : 'Could not save. Your form is kept; check the input or reload.'), 'err');
      return;
    }
    const data = await response.json();
    if (ticket !== configLoadSequence || activeTab !== 'settings') return;
    acceptSettingsEnvelope(data);
    languageSaved = Object.prototype.hasOwnProperty.call(payload.changes, 'ui.language');
    renderSettings();
    status(data.restart_recommended
      ? (zh ? '已保存，部分修改需重启后生效。' : 'Saved. Some changes require a restart.')
      : (zh ? '已保存。' : 'Saved.'), 'ok');
    if (!andRestart) return;
    status(zh ? '已保存，正在请求重启…' : 'Saved. Requesting restart…', '');
    try {
      const restart = await fetch('/v1/desktop/settings/restart', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ revision: configRevision }),
      });
      if (ticket !== configLoadSequence || activeTab !== 'settings') return;
      if (!restart.ok) {
        if (restart.status === 409) {
          const error = await restart.json().catch(() => ({}));
          if (ticket !== configLoadSequence || activeTab !== 'settings') return;
          if (error.error === 'restart_pending') { beginRestartRecovery(ticket); return; }
        }
        if (restart.status === 409) { configReady = false; $('cfg-reload').hidden = false; }
        status(zh ? '已保存，但重启请求未成功。请检查服务并重新加载。' : 'Saved, but the restart request failed. Check the service and reload.', 'err');
        return;
      }
      beginRestartRecovery(ticket);
    } catch (_) {
      if (ticket !== configLoadSequence || activeTab !== 'settings') return;
      beginRestartRecovery(ticket, true);
    }
  } catch (_) {
    if (ticket !== configLoadSequence || activeTab !== 'settings') return;
    configReady = false;
    $('cfg-reload').hidden = false;
    status(zh ? '保存结果未确认，表单已保留。请重新加载后核对。' : 'Save could not be confirmed. Your form is kept; reload to check.', 'err');
  } finally {
    configSaving = false;
    if (ticket === configLoadSequence && activeTab === 'settings') setConfigBusy(false);
    if (languageSaved) {
      const switched = await window.PeerCarryLocale?.notifyChange?.();
      if (!switched && !andRestart) status(zh ? '语言偏好已保存，当前草稿或操作结束后切换。' : 'Language preference saved. The display will switch after current drafts or actions are finished.', 'ok');
    }
    else window.PeerCarryLocale?.retry?.();
  }
}

$('cfg-save').onclick = () => saveConfig(false);
$('cfg-save-restart').onclick = () => saveConfig(true);
$('cfg-reload').onclick = () => loadConfig();

/* ------------------------------------------------------------ workbench */
const remotePeer = $('remote-peer'), remoteRefresh = $('remote-refresh'), remoteFetch = $('remote-fetch'), remoteSend = $('remote-send');
const remoteFavorite = $('remote-favorite'), devicePreferences = window.PeerCarryDevicePreferences;
$('remote-refresh').textContent = zh ? '刷新设备' : 'Refresh';
$('remote-capture-title').textContent = zh ? '设备' : 'Devices';
$('device-cards').setAttribute('aria-label', zh ? '选择目标电脑' : 'Choose a computer');
$('remote-capture-help').textContent = zh ? '获取后加入记录，点击复制才写入本机剪贴板。离线发送会排队等待上线。' : 'Fetching adds to history. Only Copy writes to your clipboard. Offline sends wait in the queue.';
remoteFetch.innerHTML = icon('download') + (zh ? '获取对方剪贴板' : 'Fetch clipboard');
remoteSend.innerHTML = icon('send') + (zh ? '发送当前剪贴板' : 'Send current clipboard');
let remoteBusy = false, remotePeers = [], peerLoadSequence = 0, remotePreferencesDirty = false, peerRefreshPending = false;
function currentPeer() { return remotePeer.value ? remotePeers.find(peer => peer.node_id === remotePeer.value) : undefined; }
function peerLabel(peer) { return peer.host || peer.dns_name || (zh ? '未命名电脑' : 'Unnamed computer'); }
function sentMessage(peer) {
  return peer.online === false
    ? (zh ? `已排队，${peerLabel(peer)} 上线后发送。` : `Queued for ${peerLabel(peer)} when it’s online.`)
    : (zh ? `已加入发送队列 · ${peerLabel(peer)}` : `Queued for ${peerLabel(peer)}.`);
}
function setRemoteStatus(message, error = false, transferred = false) {
  const element = $('remote-capture-status');
  element.textContent = message;
  element.style.color = error ? 'var(--warn)' : 'var(--ok)';
  if (transferred) {
    const link = document.createElement('button');
    link.className = 'inline-link';
    link.textContent = zh ? '查看进度' : 'View progress';
    link.onclick = () => showTab('transfers');
    element.append(link);
  }
}
function updateRemoteControls() {
  const peer = currentPeer();
  remotePeer.disabled = remoteBusy || !remotePeers.length;
  remoteRefresh.disabled = remoteBusy;
  remoteSend.disabled = remoteBusy || !peer;
  remoteFetch.disabled = remoteBusy || !peer || peer.online === false;
  const favorite = !!peer && devicePreferences.read().favorites.includes(peer.node_id);
  remoteFavorite.disabled = remoteBusy || !peer;
  remoteFavorite.textContent = favorite ? (zh ? '★ 已收藏' : '★ Favorited') : (zh ? '☆ 收藏设备' : '☆ Favorite');
  remoteFavorite.title = favorite ? (zh ? '取消收藏此设备' : 'Remove this favorite') : (zh ? '收藏此设备' : 'Favorite this device');
  remoteFavorite.setAttribute('aria-label', remoteFavorite.title);
  remoteFavorite.setAttribute('aria-pressed', String(favorite));
  for (const card of $('device-cards').querySelectorAll('button')) {
    const selected = card.dataset.nodeId === peer?.node_id;
    card.disabled = remoteBusy;
    card.classList.toggle('selected', selected);
    card.setAttribute('aria-pressed', String(selected));
    card.querySelector('.device-check').hidden = !selected;
  }
}
function renderDeviceCards(focusId = '') {
  const cards = $('device-cards');
  cards.replaceChildren();
  if (!remotePeers.length) {
    const empty = document.createElement('p');
    empty.className = 'empty';
    empty.textContent = zh ? '还没发现其他电脑。请在另一台电脑上打开 PeerCarry，再刷新。' : 'No other computers yet. Open PeerCarry on another computer, then refresh.';
    cards.append(empty);
    return;
  }
  const saved = devicePreferences.read(), order = [...saved.favorites, ...saved.recent];
  const orderedPeers = [...remotePeers].sort((a, b) => {
    const ai = order.indexOf(a.node_id), bi = order.indexOf(b.node_id);
    return (ai < 0 ? 999 : ai) - (bi < 0 ? 999 : bi) || peerLabel(a).localeCompare(peerLabel(b));
  });
  let focusCard = null;
  for (const peer of orderedPeers) {
    const card = document.createElement('button');
    card.className = 'device-card';
    card.dataset.nodeId = peer.node_id;
    card.innerHTML = icon('laptop');
    const name = document.createElement('span'); name.className = 'device-name'; name.textContent = peerLabel(peer) + (saved.favorites.includes(peer.node_id) ? ' ★' : ''); name.title = peerLabel(peer);
    const presence = document.createElement('span'); presence.className = 'device-status' + (peer.online === false ? '' : ' online');
    presence.textContent = peer.online === false ? (zh ? '离线 · 可排队' : 'Offline · can queue') : (zh ? '在线' : 'Online');
    const check = document.createElement('span'); check.className = 'device-check'; check.textContent = '✓'; check.setAttribute('aria-hidden', 'true');
    card.append(name, presence, check);
    card.onclick = () => {
      if (remoteBusy) return;
      remotePeer.value = peer.node_id;
      devicePreferences.select(peer.node_id);
      $('remote-target-notice').textContent = '';
      setRemoteStatus('');
      renderDeviceCards(peer.node_id);
    };
    cards.append(card);
    if (peer.node_id === focusId) focusCard = card;
  }
  updateRemoteControls();
  if (typeof render === 'function') render();
  focusCard?.focus();
}
function restoreTarget() {
  const resolved = devicePreferences.resolve(remotePeers.map(peer => peer.node_id));
  remotePeer.value = resolved.selected;
  renderDeviceCards();
  $('remote-target-notice').textContent = resolved.missing
    ? (zh ? '之前选择的电脑未发现，请重新选择。' : 'The previously selected computer is unavailable. Choose another.')
    : (!resolved.selected && remotePeers.length ? (zh ? '请选择目标电脑。' : 'Choose a target computer.') : '');
}
function finishRemoteBusy() {
  remoteBusy = false;
  if (remotePreferencesDirty) { remotePreferencesDirty = false; restoreTarget(); }
  updateRemoteControls();
  if (peerRefreshPending) { peerRefreshPending = false; void loadPeers(); }
  window.PeerCarryLocale?.retry?.();
}
async function loadPeers() {
  if (remoteBusy) { peerRefreshPending = true; return; }
  const ticket = ++peerLoadSequence;
  remoteBusy = true; updateRemoteControls();
  try {
    const response = await fetch('/v1/peers');
    if (!response.ok) throw new Error(response.status);
    const data = await response.json();
    if (ticket !== peerLoadSequence) return;
    remotePeers = (Array.isArray(data) ? data : []).filter(p => p && devicePreferences.isValidId(p.node_id));
    remotePeer.replaceChildren();
    const placeholder = document.createElement('option'); placeholder.value = ''; remotePeer.append(placeholder);
    for (const peer of remotePeers) {
      const option = document.createElement('option'); option.value = peer.node_id; option.textContent = peerLabel(peer); remotePeer.append(option);
    }
    restoreTarget();
  } catch (error) {
    remotePeers = []; remotePeer.value = ''; renderDeviceCards();
    $('remote-target-notice').textContent = '';
    setRemoteStatus(zh ? '暂时无法读取设备，请确认服务已启动后重试。' : 'Could not load computers. Check that the service is running and try again.', true);
  } finally { finishRemoteBusy(); }
}
async function sendEntry(entry) {
  if (remoteBusy) return;
  const peer = currentPeer();
  if (!peer) {
    const missing = devicePreferences.resolve(remotePeers.map(item => item.node_id)).missing;
    setRemoteStatus(missing
      ? (zh ? '之前选择的电脑未发现，请重新选择。' : 'The previously selected computer is unavailable. Choose another.')
      : (zh ? '请选择目标电脑。' : 'Choose a target computer.'), true);
    $('remote-capture').scrollIntoView({ block: 'center', behavior: 'smooth' });
    $('device-cards').querySelector('button')?.focus();
    return;
  }
  devicePreferences.markUsed(peer.node_id);
  remoteBusy = true; updateRemoteControls();
  setRemoteStatus(zh ? '正在发送…' : 'Sending…');
  try {
    const body = { operation: 'send', node_id: peer.node_id, expires_in_secs: 86400 };
    if (entry?.id) body.entry_id = entry.id;
    const response = await fetch('/v1/transfers', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
    if (!response.ok) throw new Error(await response.text());
    await response.json();
    const message = sentMessage(peer);
    setRemoteStatus(message, false, true); show(message, 'ok');
    refresh();
  } catch (_) {
    setRemoteStatus(zh ? '发送失败，请重试。' : 'Could not send. Try again.', true);
  } finally { finishRemoteBusy(); }
}
remotePeer.onchange = () => { if (!remoteBusy) { devicePreferences.select(remotePeer.value); setRemoteStatus(''); restoreTarget(); } };
remoteFavorite.onclick = () => { const peer = currentPeer(); if (!peer || remoteBusy) return; devicePreferences.toggleFavorite(peer.node_id); renderDeviceCards(); };
remoteRefresh.onclick = () => loadPeers();
remoteSend.onclick = () => sendEntry(null);
remoteFetch.onclick = async () => {
  const peer = currentPeer();
  if (remoteBusy || !peer || peer.online === false) return;
  devicePreferences.markUsed(peer.node_id);
  remoteBusy = true; updateRemoteControls();
  setRemoteStatus(zh ? '正在获取…' : 'Fetching…');
  try {
    const response = await fetch('/v1/actions/fetch-clipboard', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ node_id: peer.node_id }) });
    if (!response.ok) throw new Error(response.status === 403
      ? (zh ? '请先在对方电脑的设置中允许获取剪贴板。' : 'Allow clipboard access in the other computer’s settings first.')
      : (zh ? '获取失败，请重试。' : 'Could not fetch. Try again.'));
    await response.json();
    q.value = ''; const refreshed = await refresh();
    setRemoteStatus(refreshed === false
      ? (zh ? '已获取到本机历史，但列表刷新失败，请重试搜索。' : 'Added to local history, but the list could not refresh. Search again.')
      : (zh ? '已加入本机历史，剪贴板未更改；需要时点击复制。' : 'Added to local history; clipboard unchanged. Click Copy when needed.'), refreshed === false);
  } catch (error) { setRemoteStatus(error.message, true); }
  finally { finishRemoteBusy(); }
};
window.addEventListener?.('storage', event => {
  if (event.key && event.key !== devicePreferences.key) return;
  if (remoteBusy) { remotePreferencesDirty = true; return; }
  restoreTarget();
});
/* ------------------------------------------------------------ native files */

const nativeFiles = !!(window.ipc && window.ipc.postMessage);
$('file-title').textContent = zh ? '拖入文件，或选择文件' : 'Drop files here, or choose a file';
$('file-help').textContent = nativeFiles
  ? (zh ? '加入共享列表，其他电脑随时取用。' : 'Add to shared content for your other computers.')
  : (zh ? '从托盘打开应用窗口，即可拖入文件。' : 'Open the app from the tray to add files.');
$('pick-files').textContent = zh ? '选择文件' : 'Select files';
$('pick-folder').textContent = zh ? '选择文件夹' : 'Select folder';
for (const action of ['pick-files', 'pick-folder']) {
  $(action).disabled = !nativeFiles;
  $(action).onclick = () => window.ipc.postMessage(action);
}
window.nativeFileStatus = (message, error) => {
  $('file-status').textContent = message;
  $('file-status').style.color = error ? 'var(--warn)' : 'var(--ok)';
  refresh();
};
// Prevent browser fallback from navigating away when a file is dropped.
document.addEventListener('dragover', e => e.preventDefault());
document.addEventListener('drop', e => {
  e.preventDefault();
  if (!nativeFiles) show(zh ? '请在应用窗口中拖入文件' : 'Drop files in the app window', 'err');
});
q.placeholder = T.placeholder;
q.setAttribute('aria-label', T.placeholder);
window.PeerCarryLocale?.beforeReload?.(async () => {
  const revision = tabNavigationRevision;
  const busy = () => configSaving || configBusy || configRecovery || remoteBusy || copyBusy || mobileBusy || mobileTicket || window.PeerCarryTransfers?.isBusy?.();
  if (busy() || hasSettingsDraft()) return false;
  if (notebookApp && !await notebookApp.whenIdle()) return false;
  if (revision !== tabNavigationRevision || busy() || hasSettingsDraft()) return false;
  try { sessionStorage.setItem('peercarry.language.return-tab', activeTab || 'notes'); } catch (_) {}
  return true;
});
let languageReturnTab = '';
try { languageReturnTab = sessionStorage.getItem('peercarry.language.return-tab') || ''; sessionStorage.removeItem('peercarry.language.return-tab'); } catch (_) {}
if (languageReturnTab === 'settings') openSettings();
else showTab(['notes', 'todo', 'device-clipboard', 'transfers', 'ai', 'mobile'].includes(languageReturnTab) ? languageReturnTab : 'notes');
</script>
