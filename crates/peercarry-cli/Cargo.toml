[package]
name = "peercarry-cli"
default-run = "peercarry"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Command line interface for peercarry"

[[bin]]
name = "peercarry"
path = "src/main.rs"

# Compatibility executable for existing user hooks and scripts.
[[bin]]
name = "sclip"
path = "src/main.rs"

[dependencies]
peercarry-core = { workspace = true }
tokio = { workspace = true }
reqwest = { workspace = true }
clap = { workspace = true }
anyhow = { workspace = true }
dirs = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
chrono = { workspace = true }
serde_json = { workspace = true }
